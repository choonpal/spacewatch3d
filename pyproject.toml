[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spacewatch3d"
version = "0.1.0"
description = "Task-oriented collaboration scaffold for SpaceWatch3D"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18,<5"]

[project.scripts]
spacewatch3d = "spacewatch3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spacewatch3d = ["schemas/*.json"]
