<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>point cloud 생성기 v2</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101820;color:#edf3f7;font:14px system-ui,sans-serif}header{padding:18px 24px 3px}h1{font-size:24px;margin:8px 0}p{color:#b4c7d3;line-height:1.6}.toolbar{padding:10px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,a{background:#24363e;border:1px solid #496168;border-radius:6px;color:#c4ede0;padding:7px 11px;font:inherit;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#36604f}label{display:flex;gap:7px;align-items:center}#view{position:relative;height:calc(100vh - 280px);min-height:430px;margin:0 24px;background:#091119}canvas{display:block;width:100%;height:100%;touch-action:none}.panels{position:absolute;inset:0;display:grid;grid-template-columns:1fr;pointer-events:none}.panel{padding:12px;border:1px solid #39525f}.panel h2{font-size:16px;display:inline-block;background:#091119d9;padding:5px 9px;margin:0}.panel p{font-size:12px;margin:5px 9px}footer{padding:12px 24px;font-size:12px}#loading{position:absolute;top:45%;text-align:center;width:100%}#status{color:#99ddc4}</style></head>
<body><header><small>POINT CLOUD GENERATOR V2</small><h1>point cloud 생성기 v2</h1><p><span id="configuration">설정 불러오는 중</span></p></header>
<div class="toolbar"><button data-view="3d" aria-pressed="true">3D</button><button data-view="top">위에서</button><button data-view="side">옆에서</button><label><input id="cut" type="checkbox" checked>상부 가리기</label><label><input id="path" type="checkbox" checked>카메라 경로</label><label>점 크기<input id="size" aria-label="점 크기" type="range" min="1" max="4" step=".25" value="1.25"></label><a href="../registration_report.json">보정 검증 수치</a></div>
<div id="view"><div id="loading" role="status">점군 불러오는 중…</div><div class="panels"><section class="panel"><h2>10,000점 이하 성분 제거 결과</h2><p id="label0"></p></section></div></div>
<footer><div id="status" role="status"></div><p>드래그: 회전 · 오른쪽 드래그: 이동 · 휠: 확대.<br><span id="bridge-notice"></span><br>공유 프레임으로 깊이 스케일을 맞추고 프레임별 위치·회전을 영상 대응점으로 보정했습니다. 픽셀별 깊이 형태는 유지합니다. 실제 길이 단위는 정해지지 않았으며, 크기 0.02 복셀의 26방향 연결 성분 중 10,000점 이하를 제거했습니다. 반경 이상치 제거와 장거리 루프 폐쇄는 적용하지 않았습니다.</p></footer>
<script src="viewer_vendor.js"></script><script>
(async()=>{try{
const meta=await(await fetch('viewer_metadata.json')).json(),fmt=n=>n.toLocaleString('ko-KR');
document.getElementById('configuration').textContent=`${meta.width} × ${meta.height} · ${meta.interval}초 · ${meta.frames}프레임 · 설정된 마스크 · pixel_step=${meta.pixel_step}`;document.getElementById('bridge-notice').textContent=`전체 ${fmt(meta.datasets[0].points)}점 중 ${fmt(meta.datasets[0].displayed)}점 표본입니다. 빨간색은 원래 상대 자세로 연결한 미검증 경계 ${meta.unverified_bridges.length}개입니다: ${meta.bridge_times.map(t=>t.toFixed(2)+'초').join(', ')||'없음'}. 전체 PLY는 result 폴더에 있습니다.`;
document.title=meta.name;document.querySelector('h1').textContent='point cloud 생성기 v2 · '+meta.name.split('_')[0];document.getElementById('configuration').textContent+=` · ${fmt(meta.component_filter.removed_points)}점 제거 (${meta.component_filter.removed_percent.toFixed(2)}%)`;
const box=document.getElementById('view'),renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));box.prepend(renderer.domElement);renderer.domElement.setAttribute('role','img');renderer.domElement.setAttribute('aria-label',meta.name+' v2 3D 점군');
const scenes=[],materials=[],lines=[];let dirty=true;
for(let i=0;i<1;i++){
const buffers=await Promise.all(['xyz','rgb'].map(async k=>{const r=await fetch(`cloud_${i}_${k}.bin`);if(!r.ok)throw Error('점군 파일 없음');return r.arrayBuffer()})),xyz=new Float32Array(buffers[0]),rgb=new Uint8Array(buffers[1]);if(xyz.length!==3*meta.datasets[i].displayed||rgb.length!==xyz.length)throw Error('점 수 불일치');
const scene=new THREE.Scene();scene.background=new THREE.Color('#091119');const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.BufferAttribute(xyz,3));geometry.setAttribute('color',new THREE.BufferAttribute(rgb,3,true));
const material=new THREE.ShaderMaterial({uniforms:{size:{value:1.25*renderer.getPixelRatio()},cut:{value:1},cutHeight:{value:meta.cut_height}},vertexShader:`attribute vec3 color;varying vec3 c;varying float h;uniform float size;void main(){c=color;h=position.y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);gl_PointSize=size;}`,fragmentShader:`precision highp float;varying vec3 c;varying float h;uniform float cut;uniform float cutHeight;void main(){if(cut>.5&&h>cutHeight)discard;if(distance(gl_PointCoord,vec2(.5))>.5)discard;gl_FragColor=vec4(c,1.);}`});const points=new THREE.Points(geometry,material);points.frustumCulled=false;scene.add(points);
const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(meta.datasets[i].trajectory.map(v=>new THREE.Vector3(...v))),new THREE.LineBasicMaterial({color:'#ffb64d',depthTest:false}));line.renderOrder=2;scene.add(line);lines.push(line);scenes.push(scene);materials.push(material);document.getElementById('label'+i).textContent=`전체 ${fmt(meta.datasets[i].points)}점 · 표시 ${fmt(meta.datasets[i].displayed)}점`;
}
for(const b of meta.unverified_bridges||[]){const geom=new THREE.BufferGeometry().setFromPoints(b.trajectory.map(v=>new THREE.Vector3(...v)));const warning=new THREE.Line(geom,new THREE.LineBasicMaterial({color:'#ff3333',depthTest:false}));warning.renderOrder=3;scenes[0].add(warning);lines.push(warning);const markers=new THREE.Points(geom,new THREE.PointsMaterial({color:'#ff3333',size:8,sizeAttenuation:false,depthTest:false}));markers.renderOrder=4;scenes[0].add(markers);lines.push(markers)}
const bounds=meta.bounds,center=new THREE.Vector3(...bounds[0].map((v,i)=>(v+bounds[1][i])/2)),extent=Math.max(...bounds[1].map((v,i)=>v-bounds[0][i]));const camera=new THREE.PerspectiveCamera(43,1,.005,extent*50);let controls;
function resize(){renderer.setSize(box.clientWidth,box.clientHeight);camera.aspect=box.clientWidth/box.clientHeight;camera.updateProjectionMatrix();if(controls)controls.handleResize();dirty=true}
function view(v){if(controls)controls.dispose();camera.up.set(0,1,0);let dir=new THREE.Vector3(0,1,1.3).normalize();if(v==='top'){dir.set(0,1,0);camera.up.set(0,0,-1)}else if(v==='side')dir.set(0,0,1);const right=new THREE.Vector3().crossVectors(camera.up,dir).normalize(),up=new THREE.Vector3().crossVectors(dir,right).normalize(),tv=Math.tan(43*Math.PI/360),th=tv*camera.aspect;let distance=0;for(let k=0;k<8;k++){let p=new THREE.Vector3(bounds[k&1][0],bounds[(k>>1)&1][1],bounds[(k>>2)&1][2]).sub(center);distance=Math.max(distance,p.dot(dir)+Math.max(Math.abs(p.dot(right))*1.1/th,Math.abs(p.dot(up))*1.1/tv))}camera.position.copy(center).add(dir.multiplyScalar(distance));camera.lookAt(center);controls=new THREE.TrackballControls(camera,renderer.domElement);controls.staticMoving=true;controls.rotateSpeed=2;controls.panSpeed=.6;controls.zoomSpeed=1.15;controls.target.copy(center);controls.addEventListener('change',()=>dirty=true);controls.update();dirty=true;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===v)))}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));document.getElementById('cut').onchange=e=>{materials.forEach(m=>m.uniforms.cut.value=+e.target.checked);dirty=true};document.getElementById('path').onchange=e=>{lines.forEach(l=>l.visible=e.target.checked);dirty=true};document.getElementById('size').oninput=e=>{materials.forEach(m=>m.uniforms.size.value=+e.target.value*renderer.getPixelRatio());dirty=true};new ResizeObserver(resize).observe(box);resize();view('3d');document.getElementById('loading').remove();document.getElementById('status').textContent='PanoVGGT 복원 결과 · 균일 표본 표시 · 전체 PLY는 서버 저장';
function tick(){requestAnimationFrame(tick);controls.update();if(!dirty)return;renderer.setScissorTest(true);const w=box.clientWidth,h=box.clientHeight;for(let i=0;i<1;i++){renderer.setViewport(i*w,0,w,h);renderer.setScissor(i*w,0,w,h);renderer.render(scenes[i],camera)}renderer.setScissorTest(false);dirty=false}tick();
}catch(e){document.getElementById('loading').textContent='불러오기 오류: '+e.message;console.error(e)}})();
</script></body></html>
