[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spacewatch3d"
version = "0.1.0"
description = "Task-oriented collaboration scaffold for SpaceWatch3D"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18,<5"]

[project.optional-dependencies]
test = ["numpy>=1.24,<3", "scipy>=1.10,<2", "Pillow>=9.5,<12"]
ssh = ["paramiko>=3.4,<5"]

[project.scripts]
spacewatch3d = "spacewatch3d.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["spacewatch3d*", "tools", "tools.mesh_simsac*"]

[tool.setuptools.package-data]
spacewatch3d = ["schemas/*.json"]
"tools.mesh_simsac" = ["*.html", "*.css", "*.js", "*.example.json"]
